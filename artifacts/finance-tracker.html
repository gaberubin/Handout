<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Flow — Expense Tracker</title>
<style>
  :root{
    --bg:#0f1220;
    --panel:#171b2e;
    --panel-2:#1e2338;
    --border:#2a2f4a;
    --text:#eef0fa;
    --muted:#9aa1c7;
    --accent:#7c5cff;
    --accent-2:#22d3ee;
    --income:#34d399;
    --expense:#fb7185;
    --warn:#fbbf24;
    --radius:16px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background: radial-gradient(1200px 800px at 10% -10%, #22264a 0%, transparent 60%),
                radial-gradient(1000px 700px at 110% 10%, #1a2440 0%, transparent 55%),
                var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand .logo{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;color:#fff;
    box-shadow:var(--shadow);
  }
  .brand h1{
    font-size:20px;
    margin:0;
    letter-spacing:.2px;
  }
  .brand p{
    margin:0;
    font-size:12px;
    color:var(--muted);
  }
  .month-badge{
    font-size:12px;
    color:var(--muted);
    background:var(--panel-2);
    border:1px solid var(--border);
    padding:6px 12px;
    border-radius:999px;
  }

  .summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:22px;
  }
  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    box-shadow:var(--shadow);
  }
  .card .label{
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.6px;
    margin-bottom:6px;
  }
  .card .value{
    font-size:26px;
    font-weight:800;
  }
  .card.balance .value{ color: var(--accent-2); }
  .card.income .value{ color: var(--income); }
  .card.expense .value{ color: var(--expense); }

  .grid{
    display:grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap:18px;
    margin-bottom:20px;
  }
  @media (max-width: 860px){
    .grid{ grid-template-columns: 1fr; }
    .summary{ grid-template-columns: 1fr; }
  }

  .panel{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow);
  }
  .panel h2{
    margin:0 0 14px;
    font-size:15px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.6px;
  }

  form.add-form{
    display:grid;
    grid-template-columns: 1.4fr 0.8fr 1fr 0.9fr auto;
    gap:10px;
    margin-bottom:6px;
  }
  @media (max-width: 700px){
    form.add-form{ grid-template-columns: 1fr 1fr; }
  }
  input, select{
    background:#11142200;
    background-color:#0d1024;
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:10px;
    font-size:14px;
    outline:none;
    width:100%;
  }
  input::placeholder{ color:#6b7299; }
  input:focus, select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(124,92,255,0.2);
  }
  .type-toggle{
    display:flex;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .type-toggle button{
    flex:1;
    border:none;
    padding:10px 8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    background:#0d1024;
    color:var(--muted);
    transition:.15s;
  }
  .type-toggle button.active.expense{ background:var(--expense); color:#1a0a0a; }
  .type-toggle button.active.income{ background:var(--income); color:#04150e; }

  button.submit{
    border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;
    font-weight:700;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    white-space:nowrap;
  }
  button.submit:hover{ filter:brightness(1.08); }
  button.submit:active{ transform:translateY(1px); }

  .filters{
    display:flex;
    gap:10px;
    margin:16px 0 12px;
    flex-wrap:wrap;
  }
  .filters input, .filters select{ width:auto; flex:1; min-width:140px; }

  .tx-list{
    list-style:none;
    margin:0;
    padding:0;
    max-height:420px;
    overflow-y:auto;
  }
  .tx-list::-webkit-scrollbar{ width:8px; }
  .tx-list::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }

  .tx-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 6px;
    border-bottom:1px solid var(--border);
  }
  .tx-item:last-child{ border-bottom:none; }
  .tx-icon{
    width:38px;height:38px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex-shrink:0;
  }
  .tx-main{ flex:1; min-width:0; }
  .tx-desc{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tx-meta{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .tx-amount{
    font-weight:800;
    font-size:14px;
    white-space:nowrap;
  }
  .tx-amount.income{ color:var(--income); }
  .tx-amount.expense{ color:var(--expense); }
  .tx-del{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:16px;
    padding:4px 6px;
    border-radius:6px;
  }
  .tx-del:hover{ color:var(--expense); background:rgba(251,113,133,0.1); }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:40px 10px;
    font-size:14px;
  }

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    margin-top:14px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
  }
  .legend-dot{
    width:9px;height:9px;border-radius:50%;
  }

  .bars{
    display:flex;
    align-items:flex-end;
    gap:8px;
    height:140px;
    margin-top:10px;
  }
  .bar-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    height:100%;
    justify-content:flex-end;
  }
  .bar-track{
    width:100%;
    max-width:26px;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    border-radius:6px;
    overflow:hidden;
    background:#0d1024;
  }
  .bar-fill{
    width:100%;
    border-radius:6px 6px 0 0;
  }
  .bar-label{
    font-size:10px;
    color:var(--muted);
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:30px;
  }
  .reset-link{
    color:var(--muted);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    font-size:12px;
  }
  .reset-link:hover{ color:var(--expense); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">FF</div>
      <div>
        <h1>Finance Flow</h1>
        <p>Your personal income &amp; expense tracker</p>
      </div>
    </div>
    <div class="month-badge" id="todayBadge"></div>
  </header>

  <div class="summary">
    <div class="card balance">
      <div class="label">Balance</div>
      <div class="value" id="balanceVal">$0.00</div>
    </div>
    <div class="card income">
      <div class="label">Total Income</div>
      <div class="value" id="incomeVal">$0.00</div>
    </div>
    <div class="card expense">
      <div class="label">Total Expenses</div>
      <div class="value" id="expenseVal">$0.00</div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:20px;">
    <h2>Add Transaction</h2>
    <form class="add-form" id="txForm">
      <input type="text" id="descInput" placeholder="Description (e.g. Groceries)" required maxlength="60"/>
      <input type="number" id="amountInput" placeholder="Amount" step="0.01" min="0.01" required/>
      <select id="categoryInput"></select>
      <div class="type-toggle" id="typeToggle">
        <button type="button" data-type="expense" class="active expense">Expense</button>
        <button type="button" data-type="income" class="income">Income</button>
      </div>
      <button type="submit" class="submit">Add</button>
    </form>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Transactions</h2>
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search description..." />
        <select id="filterType">
          <option value="all">All types</option>
          <option value="income">Income only</option>
          <option value="expense">Expense only</option>
        </select>
        <select id="filterCategory">
          <option value="all">All categories</option>
        </select>
      </div>
      <ul class="tx-list" id="txList"></ul>
    </div>

    <div class="panel">
      <h2>Spending by Category</h2>
      <svg id="pieChart" viewBox="0 0 200 200" width="100%" style="max-width:220px;display:block;margin:0 auto;"></svg>
      <div class="legend" id="pieLegend"></div>

      <h2 style="margin-top:24px;">Last 6 Months</h2>
      <div class="bars" id="trendBars"></div>
    </div>
  </div>

  <footer>
    All data is stored locally in your browser (localStorage). Nothing is sent anywhere.
    <br/>
    <button class="reset-link" id="resetBtn">Clear all data</button>
  </footer>

</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "financeFlow.transactions.v1";

  var CATEGORIES = {
    "Food & Dining":   "#fb7185",
    "Transport":       "#fbbf24",
    "Housing":         "#7c5cff",
    "Shopping":        "#22d3ee",
    "Entertainment":   "#a78bfa",
    "Health":          "#34d399",
    "Utilities":       "#f472b6",
    "Salary":          "#4ade80",
    "Freelance":       "#60a5fa",
    "Other":           "#9aa1c7"
  };

  var categorySelect = document.getElementById("categoryInput");
  Object.keys(CATEGORIES).forEach(function(cat){
    var opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    categorySelect.appendChild(opt);
  });

  var filterCategory = document.getElementById("filterCategory");
  Object.keys(CATEGORIES).forEach(function(cat){
    var opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    filterCategory.appendChild(opt);
  });

  var seedData = [
    { id: "seed1", desc: "Monthly Salary", amount: 4200, type: "income", category: "Salary", date: daysAgoISO(2) },
    { id: "seed2", desc: "Rent", amount: 1450, type: "expense", category: "Housing", date: daysAgoISO(1) },
    { id: "seed3", desc: "Groceries", amount: 96.40, type: "expense", category: "Food & Dining", date: daysAgoISO(3) },
    { id: "seed4", desc: "Gas", amount: 42.10, type: "expense", category: "Transport", date: daysAgoISO(5) },
    { id: "seed5", desc: "Freelance project", amount: 650, type: "income", category: "Freelance", date: daysAgoISO(10) },
    { id: "seed6", desc: "Netflix", amount: 15.99, type: "expense", category: "Entertainment", date: daysAgoISO(6) },
    { id: "seed7", desc: "Electric bill", amount: 78.30, type: "expense", category: "Utilities", date: daysAgoISO(20) },
    { id: "seed8", desc: "Gym membership", amount: 45, type: "expense", category: "Health", date: daysAgoISO(15) },
    { id: "seed9", desc: "New shoes", amount: 89.99, type: "expense", category: "Shopping", date: daysAgoISO(40) },
    { id: "seed10", desc: "Salary", amount: 4200, type: "income", category: "Salary", date: daysAgoISO(33) },
    { id: "seed11", desc: "Coffee run", amount: 6.75, type: "expense", category: "Food & Dining", date: daysAgoISO(60) },
    { id: "seed12", desc: "Salary", amount: 4200, type: "income", category: "Salary", date: daysAgoISO(63) }
  ];

  function daysAgoISO(n){
    var d = new Date();
    d.setDate(d.getDate() - n);
    return d.toISOString().slice(0,10);
  }

  function loadTx(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seedData));
        return seedData.slice();
      }
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error("bad data");
      return parsed;
    }catch(e){
      return seedData.slice();
    }
  }

  function saveTx(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  var transactions = loadTx();
  var currentType = "expense";

  var typeToggle = document.getElementById("typeToggle");
  typeToggle.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if (!btn) return;
    currentType = btn.getAttribute("data-type");
    typeToggle.querySelectorAll("button").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
  });

  var txForm = document.getElementById("txForm");
  txForm.addEventListener("submit", function(e){
    e.preventDefault();
    var desc = document.getElementById("descInput").value.trim();
    var amount = parseFloat(document.getElementById("amountInput").value);
    var category = categorySelect.value;

    if (!desc || isNaN(amount) || amount <= 0) return;

    var tx = {
      id: "tx_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
      desc: desc,
      amount: Math.round(amount * 100) / 100,
      type: currentType,
      category: category,
      date: new Date().toISOString().slice(0,10)
    };

    transactions.unshift(tx);
    saveTx(transactions);
    txForm.reset();
    categorySelect.value = category;
    render();
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    if (confirm("This will delete all transactions. Continue?")){
      transactions = [];
      saveTx(transactions);
      render();
    }
  });

  var searchInput = document.getElementById("searchInput");
  var filterType = document.getElementById("filterType");
  searchInput.addEventListener("input", render);
  filterType.addEventListener("change", render);
  filterCategory.addEventListener("change", render);

  function fmtMoney(n){
    var sign = n < 0 ? "-" : "";
    return sign + "$" + Math.abs(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function fmtDate(iso){
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
  }

  function catColor(cat){
    return CATEGORIES[cat] || CATEGORIES["Other"];
  }

  function catIcon(cat){
    var icons = {
      "Food & Dining":"🍔","Transport":"🚗","Housing":"🏠","Shopping":"🛍️",
      "Entertainment":"🎬","Health":"💊","Utilities":"💡","Salary":"💰",
      "Freelance":"💼","Other":"📦"
    };
    return icons[cat] || "📦";
  }

  function getFiltered(){
    var q = searchInput.value.trim().toLowerCase();
    var t = filterType.value;
    var c = filterCategory.value;
    return transactions.filter(function(tx){
      if (q && tx.desc.toLowerCase().indexOf(q) === -1) return false;
      if (t !== "all" && tx.type !== t) return false;
      if (c !== "all" && tx.category !== c) return false;
      return true;
    });
  }

  function renderSummary(){
    var income = 0, expense = 0;
    transactions.forEach(function(tx){
      if (tx.type === "income") income += tx.amount;
      else expense += tx.amount;
    });
    document.getElementById("incomeVal").textContent = fmtMoney(income);
    document.getElementById("expenseVal").textContent = fmtMoney(expense);
    document.getElementById("balanceVal").textContent = fmtMoney(income - expense);
  }

  function renderList(){
    var list = document.getElementById("txList");
    var items = getFiltered().slice().sort(function(a,b){ return b.date.localeCompare(a.date) || b.id.localeCompare(a.id); });

    if (items.length === 0){
      list.innerHTML = '<li class="empty">No transactions match your filters.</li>';
      return;
    }

    list.innerHTML = "";
    items.forEach(function(tx){
      var li = document.createElement("li");
      li.className = "tx-item";

      var icon = document.createElement("div");
      icon.className = "tx-icon";
      icon.style.background = catColor(tx.category) + "26";
      icon.textContent = catIcon(tx.category);

      var main = document.createElement("div");
      main.className = "tx-main";
      var desc = document.createElement("div");
      desc.className = "tx-desc";
      desc.textContent = tx.desc;
      var meta = document.createElement("div");
      meta.className = "tx-meta";
      meta.textContent = tx.category + " · " + fmtDate(tx.date);
      main.appendChild(desc);
      main.appendChild(meta);

      var amount = document.createElement("div");
      amount.className = "tx-amount " + tx.type;
      amount.textContent = (tx.type === "income" ? "+" : "-") + fmtMoney(tx.amount);

      var del = document.createElement("button");
      del.className = "tx-del";
      del.title = "Delete";
      del.innerHTML = "&times;";
      del.addEventListener("click", function(){
        transactions = transactions.filter(function(t){ return t.id !== tx.id; });
        saveTx(transactions);
        render();
      });

      li.appendChild(icon);
      li.appendChild(main);
      li.appendChild(amount);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  function renderPie(){
    var totals = {};
    var grandTotal = 0;
    transactions.forEach(function(tx){
      if (tx.type !== "expense") return;
      totals[tx.category] = (totals[tx.category] || 0) + tx.amount;
      grandTotal += tx.amount;
    });

    var svg = document.getElementById("pieChart");
    var legend = document.getElementById("pieLegend");
    svg.innerHTML = "";
    legend.innerHTML = "";

    if (grandTotal <= 0){
      var text = document.createElementNS("http://www.w3.org/2000/svg","text");
      text.setAttribute("x","100");
      text.setAttribute("y","104");
      text.setAttribute("text-anchor","middle");
      text.setAttribute("fill","#9aa1c7");
      text.setAttribute("font-size","12");
      text.textContent = "No expenses yet";
      svg.appendChild(text);
      return;
    }

    var cx = 100, cy = 100, r = 80, innerR = 46;
    var startAngle = -Math.PI / 2;

    var sorted = Object.keys(totals).sort(function(a,b){ return totals[b] - totals[a]; });

    sorted.forEach(function(cat){
      var value = totals[cat];
      var fraction = value / grandTotal;
      var endAngle = startAngle + fraction * Math.PI * 2;

      var x1 = cx + r * Math.cos(startAngle);
      var y1 = cy + r * Math.sin(startAngle);
      var x2 = cx + r * Math.cos(endAngle);
      var y2 = cy + r * Math.sin(endAngle);
      var ix1 = cx + innerR * Math.cos(endAngle);
      var iy1 = cy + innerR * Math.sin(endAngle);
      var ix2 = cx + innerR * Math.cos(startAngle);
      var iy2 = cy + innerR * Math.sin(startAngle);

      var largeArc = fraction > 0.5 ? 1 : 0;

      var d = [
        "M", x1, y1,
        "A", r, r, 0, largeArc, 1, x2, y2,
        "L", ix1, iy1,
        "A", innerR, innerR, 0, largeArc, 0, ix2, iy2,
        "Z"
      ].join(" ");

      var path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d", d);
      path.setAttribute("fill", catColor(cat));
      var title = document.createElementNS("http://www.w3.org/2000/svg","title");
      title.textContent = cat + ": " + fmtMoney(value) + " (" + Math.round(fraction*100) + "%)";
      path.appendChild(title);
      svg.appendChild(path);

      startAngle = endAngle;

      var item = document.createElement("div");
      item.className = "legend-item";
      var dot = document.createElement("span");
      dot.className = "legend-dot";
      dot.style.background = catColor(cat);
      item.appendChild(dot);
      item.appendChild(document.createTextNode(cat + " — " + Math.round(fraction*100) + "%"));
      legend.appendChild(item);
    });

    var centerText = document.createElementNS("http://www.w3.org/2000/svg","text");
    centerText.setAttribute("x","100");
    centerText.setAttribute("y","96");
    centerText.setAttribute("text-anchor","middle");
    centerText.setAttribute("fill","#eef0fa");
    centerText.setAttribute("font-size","14");
    centerText.setAttribute("font-weight","800");
    centerText.textContent = fmtMoney(grandTotal);
    svg.appendChild(centerText);

    var centerLabel = document.createElementNS("http://www.w3.org/2000/svg","text");
    centerLabel.setAttribute("x","100");
    centerLabel.setAttribute("y","112");
    centerLabel.setAttribute("text-anchor","middle");
    centerLabel.setAttribute("fill","#9aa1c7");
    centerLabel.setAttribute("font-size","9");
    centerLabel.textContent = "TOTAL SPENT";
    svg.appendChild(centerLabel);
  }

  function renderTrend(){
    var container = document.getElementById("trendBars");
    container.innerHTML = "";

    var months = [];
    var now = new Date();
    for (var i = 5; i >= 0; i--){
      var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({
        key: d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"),
        label: d.toLocaleDateString(undefined, { month:"short" }),
        income: 0,
        expense: 0
      });
    }

    transactions.forEach(function(tx){
      var key = tx.date.slice(0,7);
      var m = months.find(function(mo){ return mo.key === key; });
      if (!m) return;
      if (tx.type === "income") m.income += tx.amount;
      else m.expense += tx.amount;
    });

    var maxVal = Math.max.apply(null, months.map(function(m){ return Math.max(m.income, m.expense); }).concat([1]));

    months.forEach(function(m){
      var col = document.createElement("div");
      col.className = "bar-col";

      var track = document.createElement("div");
      track.className = "bar-track";
      track.style.display = "flex";
      track.style.flexDirection = "row";
      track.style.alignItems = "flex-end";
      track.style.gap = "2px";
      track.style.height = "100px";

      var expenseBar = document.createElement("div");
      expenseBar.style.flex = "1";
      expenseBar.style.height = Math.max(2, (m.expense / maxVal) * 100) + "px";
      expenseBar.style.background = "var(--expense)";
      expenseBar.style.borderRadius = "4px 4px 0 0";
      expenseBar.title = "Expenses: " + fmtMoney(m.expense);

      var incomeBar = document.createElement("div");
      incomeBar.style.flex = "1";
      incomeBar.style.height = Math.max(2, (m.income / maxVal) * 100) + "px";
      incomeBar.style.background = "var(--income)";
      incomeBar.style.borderRadius = "4px 4px 0 0";
      incomeBar.title = "Income: " + fmtMoney(m.income);

      track.appendChild(expenseBar);
      track.appendChild(incomeBar);

      var label = document.createElement("div");
      label.className = "bar-label";
      label.textContent = m.label;

      col.appendChild(track);
      col.appendChild(label);
      container.appendChild(col);
    });
  }

  function renderBadge(){
    var d = new Date();
    document.getElementById("todayBadge").textContent = d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric", year:"numeric" });
  }

  function render(){
    renderSummary();
    renderList();
    renderPie();
    renderTrend();
  }

  renderBadge();
  render();
})();
</script>
</body>
</html>
